<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia Digital Bookshelf</title>
    
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, sans-serif;
            overflow: hidden;
            width: 240px; height: 320px;
        }
        #library-view { 
            padding: 20px 10px; width: 240px; height: 320px; overflow-y: auto; box-sizing: border-box; 
        }
        .section-title { font-size: 12px; color: #00bc8c; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .book-item { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 15px; margin-bottom: 10px; cursor: pointer; font-size: 14px; font-weight: bold; color: #fff; }
        .book-item:active { background: #00bc8c; color: #000; }

        #reader-container { 
            display: none; position: absolute; top: 0; left: 0; 
            width: 240px; height: 320px; background: #121212; z-index: 100; 
        }
        #book-content { 
            width: 240px; height: 320px; padding: 10px; box-sizing: border-box; 
            overflow-y: auto; font-size: 14px; line-height: 1.5; color: #e0e0e0;
            white-space: normal; text-align: justify; text-justify: inter-word; word-wrap: break-word;
        }
        #book-content::-webkit-scrollbar { display: none; }
        #book-content { -ms-overflow-style: none; scrollbar-width: none; }

        #toast {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9); color: #00bc8c; padding: 10px 20px; border-radius: 20px;
            font-size: 14px; font-weight: bold; z-index: 200; pointer-events: none;
            border: 1px solid #00bc8c; text-align: center;
        }
    </style>
</head>
<body>

    <div id="library-view">
        <div class="section-title">My Bookshelf</div>
        <div class="book-item" onclick="openBook('book.txt', 'book1')">📖 Livewired</div>
        <div class="book-item" onclick="openBook('book2.txt', 'book2')">📖 Book 2</div>
    </div>

    <div id="reader-container">
        <div id="book-content" tabindex="0"></div>
    </div>

    <div id="toast"></div>

    <script>
        var currentFontSize = 14;
        var contentDiv = document.getElementById('book-content');
        var currentBookId = '';

        function openBook(fileName, bookId) {
            currentBookId = bookId;
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('reader-container').style.display = 'block';

            fetch(fileName)
                .then(response => {
                    if (!response.ok) throw new Error("File not found");
                    return response.text();
                })
                .then(text => {
                    contentDiv.textContent = text; 
                    applyFontSize();
                    var savedPos = localStorage.getItem(bookId + '_scroll_pos');
                    contentDiv.scrollTop = savedPos ? parseInt(savedPos) : 0;
                })
                .catch(err => {
                    showToast("Error loading book");
                    setTimeout(goBack, 1500);
                });
        }

        function applyFontSize() {
            contentDiv.style.fontSize = currentFontSize + "px";
        }

        function adjustFont(direction) {
            if (direction === 1 && currentFontSize < 22) currentFontSize += 2;
            else if (direction === -1 && currentFontSize > 10) currentFontSize -= 2;
            applyFontSize();
            showToast("Font: " + currentFontSize + "px");
        }

        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(function() { toast.style.display = 'none'; }, 1500);
        }

        function goBack() {
            if (currentBookId) {
                localStorage.setItem(currentBookId + '_scroll_pos', contentDiv.scrollTop);
            }
            document.getElementById('reader-container').style.display = 'none';
            document.getElementById('library-view').style.display = 'block';
            currentBookId = '';
        }

        // --- BULLETPROOF KEYPAD CONTROLS ---
        // Attached to 'document' with capture=true to catch keys no matter what has focus
        document.addEventListener('keydown', function(e) {
            var key = e.key;
            var code = e.keyCode || e.which; // Fallback for older Nokia browsers
            var isReaderOpen = document.getElementById('reader-container').style.display === 'block';

            if (isReaderOpen) {
                var pageHeight = contentDiv.clientHeight - 10; 

                if (key === '8' || code === 40) {
                    contentDiv.scrollBy(0, pageHeight);
                }
                else if (key === '2' || code === 38) {
                    contentDiv.scrollBy(0, -pageHeight);
                }
                else if (key === '#' || code === 35) {
                    adjustFont(1);
                }
                else if (key === '*' || code === 106 || code === 42) {
                    adjustFont(-1);
                }
                else if (key === '9' || code === 57) {
                    goBack();
                }
                // NEW: Press 0 to open AI Chat
                else if (key === '0' || code === 48) {
                    e.preventDefault(); // Stop default behavior
                    
                    if (currentBookId) {
                        localStorage.setItem(currentBookId + '_scroll_pos', contentDiv.scrollTop);
                    }
                    
                    // Show visual feedback so you KNOW the key was pressed
                    showToast("Opening Chat...");
                    
                    // Small delay so you can see the message before the page changes
                    setTimeout(function() {
                        window.location.href = 'chat.html';
                    }, 600);
                }
            }
        }, true);

        contentDiv.addEventListener('scroll', function() {
            if (currentBookId) {
                localStorage.setItem(currentBookId + '_scroll_pos', contentDiv.scrollTop);
            }
        });
    </script>
</body>
</html>
