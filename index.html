<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia Digital Bookshelf</title>
    
    <!-- LOCAL FILES: Loading directly from your repository, bypassing CDN blocks -->
    <script src="jszip.min.js"></script>
    <script src="epub.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .header {
            background-color: #1f1f1f;
            height: 40px;
            line-height: 40px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px solid #00bc8c;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            box-sizing: border-box;
        }
        .header-btn {
            color: #00bc8c;
            cursor: pointer;
            font-size: 13px;
        }
        #library-view {
            padding: 10px;
        }
        .section-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .book-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }
        .book-item:focus {
            background: #00bc8c;
            border-color: #fff;
            outline: none;
        }
        #reader-view {
            display: none;
            width: 100vw;
            height: calc(100vh - 40px);
            background: #1a1a1a;
            overflow-y: auto;
        }
        #loading {
            display: none;
            color: #00bc8c;
            font-size: 14px;
            margin-top: 20px;
            text-align: center;
        }
        #error-debug {
            color: #ff6b6b;
            font-size: 12px;
            padding: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <span id="back-btn" class="header-btn" style="visibility: hidden;" onclick="goBack()">✕ Back</span>
        <span id="nav-title">My Digital Bookshelf</span>
        <span class="header-btn" style="visibility: hidden;"></span>
    </div>
    
    <div id="library-view">
        <div class="section-title">Select an E-Book:</div>
        <div class="book-item" tabindex="0" onclick="openBook('book.epub', 'Livewired')">
            📖 1. Livewired (David Eagleman)
        </div>
    </div>

    <div id="loading">Loading book... please wait.</div>
    <div id="error-debug"></div>
    <div id="reader-view"></div>

    <script>
        var book = null;
        var rendition = null;

        function openBook(fileName, bookTitle) {
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error-debug').style.display = 'none';
            document.getElementById('nav-title').innerText = "Loading...";
            document.getElementById('back-btn').style.visibility = 'visible';

            // Check if local libraries loaded
            if (typeof JSZip === 'undefined') {
                showError("JSZip file is missing or failed to load. Did you upload jszip.min.js?");
                return;
            }
            if (typeof ePub === 'undefined') {
                showError("Epub.js file is missing or failed to load. Did you upload epub.min.js?");
                return;
            }

            try {
                book = ePub(fileName);
                rendition = book.renderTo("reader-view", {
                    width: "100%",
                    height: "100%",
                    flow: "scrolled-doc"
                });

                rendition.themes.default({
                    "body": { 
                        "color": "#e0e0e0", 
                        "background": "#1a1a1a", 
                        "font-size": "16px", 
                        "line-height": "1.6",
                        "padding": "10px"
                    }
                });

                rendition.display().then(function() {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('reader-view').style.display = 'block';
                    document.getElementById('nav-title').innerText = bookTitle;
                }).catch(function(err) {
                    showError("Error reading book.epub: " + err.message);
                });
            } catch (err) {
                showError("System error: " + err.message);
            }
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-debug').style.display = 'block';
            document.getElementById('error-debug').innerHTML = "⚠️ " + msg;
        }

        function goBack() {
            if (rendition) {
                rendition.destroy();
                rendition = null;
                book = null;
            }
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-debug').style.display = 'none';
            document.getElementById('library-view').style.display = 'block';
            document.getElementById('nav-title').innerText = "My Digital Bookshelf";
            document.getElementById('back-btn').style.visibility = 'hidden';
        }

        document.addEventListener('keydown', function(e) {
            if (rendition && document.getElementById('reader-view').style.display === 'block') {
                if (e.keyCode === 40 || e.key === 'ArrowDown') {
                    window.scrollBy(0, 80);
                } else if (e.keyCode === 38 || e.key === 'ArrowUp') {
                    window.scrollBy(0, -80);
                }
            }
        });
    </script>

</body>
</html>
