<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia Digital Bookshelf</title>
    
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, sans-serif;
            overflow: hidden;
            width: 240px; height: 320px;
        }
        .header {
            background-color: #1f1f1f;
            height: 35px; line-height: 35px;
            font-size: 13px; font-weight: bold;
            text-align: center;
            border-bottom: 2px solid #00bc8c;
            display: flex; justify-content: space-between;
            padding: 0 8px; box-sizing: border-box;
            width: 240px;
        }
        .header-btn { color: #00bc8c; cursor: pointer; font-size: 12px; }
        
        #library-view { padding: 10px; width: 240px; height: 285px; overflow-y: auto; }
        .section-title { font-size: 11px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .book-item { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 12px; margin-bottom: 8px; cursor: pointer; font-size: 13px; font-weight: bold; color: #fff; }
        
        /* READER AREA */
        #reader-container { 
            display: none; width: 240px; height: 285px; position: relative; background: #1a1a1a; 
        }
        #book-content { 
            width: 220px; 
            height: 245px; 
            background: #1a1a1a; 
            color: #e0e0e0;
            padding: 10px; 
            box-sizing: border-box;
            overflow-y: auto; 
            font-size: 14px; 
            line-height: 1.6;
            position: absolute; top: 0; left: 0;
            white-space: pre-wrap; /* Crucial: preserves paragraphs from TXT file */
            word-wrap: break-word;
        }
        
        #status-bar {
            position: absolute; bottom: 0; left: 0; width: 240px; height: 40px;
            background: #1f1f1f; border-top: 1px solid #333;
            display: flex; justify-content: center; align-items: center;
            font-size: 10px; color: #888;
        }
        
        #loading { display: none; color: #00bc8c; font-size: 14px; margin-top: 100px; text-align: center; width: 240px; }
        #toast {
            display: none; position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 188, 140, 0.9); color: #000; padding: 6px 12px; border-radius: 4px;
            font-size: 12px; font-weight: bold; z-index: 30; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <span id="back-btn" class="header-btn" style="visibility: hidden;" onclick="goBack()">✕ Back</span>
        <span id="nav-title">My Digital Bookshelf</span>
        <span class="header-btn" style="visibility: hidden;"></span>
    </div>
    
    <div id="library-view">
        <div class="section-title">Select an E-Book:</div>
        <div class="book-item" tabindex="0" onclick="openBook('book.txt', 'Livewired')">
            📖 1. Livewired (David Eagleman)
        </div>
    </div>

    <div id="loading">Loading text... please wait.</div>
    
    <div id="reader-container">
        <div id="book-content" tabindex="0"></div>
        <div id="status-bar">2/8 to scroll | #/* to zoom</div>
    </div>

    <div id="toast"></div>

    <script>
        var currentFontSize = 14;

        function openBook(fileName, bookTitle) {
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('reader-container').style.display = 'block';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('nav-title').innerText = "Loading...";
            document.getElementById('back-btn').style.visibility = 'visible';

            // Fetch the raw text file
            fetch(fileName)
                .then(response => {
                    if (!response.ok) throw new Error("File not found");
                    return response.text();
                })
                .then(text => {
                    // Inject text safely
                    document.getElementById('book-content').innerText = text;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('nav-title').innerText = bookTitle;
                    applyFontSize();
                })
                .catch(err => {
                    document.getElementById('loading').innerText = "Error: Could not load book.txt. Did you upload it?";
                });
        }

        function applyFontSize() {
            document.getElementById('book-content').style.fontSize = currentFontSize + "px";
        }

        function adjustFont(direction) {
            if (direction === 1 && currentFontSize < 24) currentFontSize += 2;
            else if (direction === -1 && currentFontSize > 10) currentFontSize -= 2;
            applyFontSize();
            showToast("Font: " + currentFontSize + "px");
        }

        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(function() { toast.style.display = 'none'; }, 1200);
        }

        function goBack() {
            document.getElementById('reader-container').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('library-view').style.display = 'block';
            document.getElementById('nav-title').innerText = "My Digital Bookshelf";
            document.getElementById('back-btn').style.visibility = 'hidden';
            document.getElementById('book-content').scrollTop = 0; // Reset scroll
        }

        // --- KEYPAD CONTROLS ---
        window.addEventListener('keydown', function(e) {
            var content = document.getElementById('book-content');
            if (!content || document.getElementById('reader-container').style.display === 'none') return;

            var key = e.key;
            var code = e.keyCode;

            // 8 or Down: Scroll Down
            if (key === '8' || code === 40) {
                content.scrollBy(0, 150);
            }
            // 2 or Up: Scroll Up
            else if (key === '2' || code === 38) {
                content.scrollBy(0, -150);
            }
            // # : Zoom In
            else if (key === '#' || code === 35) {
                adjustFont(1);
            }
            // * : Zoom Out
            else if (key === '*' || code === 106) {
                adjustFont(-1);
            }
        }, true); 
    </script>

</body>
</html>
