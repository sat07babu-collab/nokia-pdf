<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia Digital Bookshelf</title>
    
    <!-- LOCAL FILES -->
    <script src="jszip.min.js"></script>
    <script src="epub.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, sans-serif;
            overflow: hidden;
            width: 240px;
            height: 320px;
        }
        .header {
            background-color: #1f1f1f;
            height: 35px;
            line-height: 35px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px solid #00bc8c;
            display: flex;
            justify-content: space-between;
            padding: 0 8px;
            box-sizing: border-box;
            width: 240px;
        }
        .header-btn {
            color: #00bc8c;
            cursor: pointer;
            font-size: 12px;
        }
        #library-view {
            padding: 10px;
            width: 240px;
            height: 285px;
            overflow-y: auto;
        }
        .section-title {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .book-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }
        
        /* READER AREA */
        #reader-container {
            display: none;
            width: 240px;
            height: 285px; /* Leaves room for buttons */
            position: relative;
            background: #1a1a1a;
        }
        #reader-view {
            width: 240px !important;
            height: 245px !important; /* Slightly smaller to fit buttons */
            background: #1a1a1a;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
        }
        #reader-view iframe {
            width: 240px !important;
            height: 245px !important;
            border: none !important;
        }
        
        /* ON-SCREEN NAVIGATION BUTTONS */
        #page-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 240px;
            height: 40px;
            background: #1f1f1f;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            z-index: 10;
        }
        .nav-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btn:active {
            background: #00bc8c;
            color: #000;
        }
        
        #loading {
            display: none;
            color: #00bc8c;
            font-size: 14px;
            margin-top: 100px;
            text-align: center;
            width: 240px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span id="back-btn" class="header-btn" style="visibility: hidden;" onclick="goBack()">✕ Back</span>
        <span id="nav-title">My Digital Bookshelf</span>
        <span class="header-btn" style="visibility: hidden;"></span>
    </div>
    
    <div id="library-view">
        <div class="section-title">Select an E-Book:</div>
        <div class="book-item" tabindex="0" onclick="openBook('book.epub', 'Livewired')">
            📖 1. Livewired (David Eagleman)
        </div>
    </div>

    <div id="loading">Loading book... please wait.</div>
    
    <!-- Reader and Controls -->
    <div id="reader-container">
        <div id="reader-view" tabindex="0"></div>
        <div id="page-controls">
            <button class="nav-btn" onclick="turnPage(-1)">◀ Prev</button>
            <span id="page-indicator" style="font-size:10px; color:#888;">Cover</span>
            <button class="nav-btn" onclick="turnPage(1)">Next ▶</button>
        </div>
    </div>

    <script>
        var book = null;
        var rendition = null;

        function openBook(fileName, bookTitle) {
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('reader-container').style.display = 'block';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('nav-title').innerText = "Loading...";
            document.getElementById('back-btn').style.visibility = 'visible';

            if (typeof JSZip === 'undefined' || typeof ePub === 'undefined') {
                document.getElementById('loading').innerText = "Libraries failed to load.";
                return;
            }

            try {
                book = ePub(fileName);
                
                rendition = book.renderTo("reader-view", {
                    width: 240,
                    height: 245,
                    flow: "paginated"
                });

                rendition.themes.default({
                    "body": { 
                        "color": "#e0e0e0", 
                        "background": "#1a1a1a", 
                        "font-size": "14px", 
                        "line-height": "1.4",
                        "padding": "5px",
                        "margin": "0"
                    }
                });

                rendition.display().then(function() {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('nav-title').innerText = bookTitle;
                    
                    // Force focus to the reader so keypad works
                    document.getElementById('reader-view').focus();
                    
                    setTimeout(function() {
                        rendition.resize(240, 245);
                    }, 500);
                    
                }).catch(function(err) {
                    document.getElementById('loading').innerText = "Error: " + err.message;
                });
            } catch (err) {
                document.getElementById('loading').innerText = "System error.";
            }
        }

        // Function to turn pages using buttons
        function turnPage(direction) {
            if (rendition) {
                if (direction === 1) {
                    rendition.next();
                } else {
                    rendition.prev();
                }
                // Return focus to reader so keypad still works after clicking button
                document.getElementById('reader-view').focus();
            }
        }

        function goBack() {
            if (rendition) {
                rendition.destroy();
                rendition = null;
                book = null;
            }
            document.getElementById('reader-container').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('library-view').style.display = 'block';
            document.getElementById('nav-title').innerText = "My Digital Bookshelf";
            document.getElementById('back-btn').style.visibility = 'hidden';
        }

        // Keypad navigation
        document.addEventListener('keydown', function(e) {
            if (rendition && document.getElementById('reader-container').style.display === 'block') {
                if (e.keyCode === 40 || e.key === 'ArrowDown' || e.keyCode === 39 || e.key === 'ArrowRight') {
                    turnPage(1);
                } 
                else if (e.keyCode === 38 || e.key === 'ArrowUp' || e.keyCode === 37 || e.key === 'ArrowLeft') {
                    turnPage(-1);
                }
            }
        });
    </script>

</body>
</html>
