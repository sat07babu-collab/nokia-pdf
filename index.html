<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia Digital Bookshelf</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .header {
            background-color: #1f1f1f;
            height: 40px;
            line-height: 40px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px solid #00bc8c;
        }
        #library-view {
            padding: 10px;
        }
        .section-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .book-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }
        .book-item:focus {
            background: #00bc8c;
            border-color: #fff;
            outline: none;
        }
        #reader-view {
            display: none;
            width: 100vw;
            height: calc(100vh - 40px);
            background: #1a1a1a;
        }
        #loading {
            display: none;
            color: #00bc8c;
            font-size: 14px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header" id="nav-title">My Digital Bookshelf</div>
    
    <div id="library-view">
        <div class="section-title">Select an E-Book:</div>
        
        <!-- FIXED: Inserted your complete raw book URL -->
        <div class="book-item" tabindex="0" onclick="openBook('https://githubusercontent.com', 'Livewired')">
            📖 1. Livewired (David Eagleman)
        </div>
    </div>

    <div id="loading">Unpacking chapters... please wait.</div>
    <div id="reader-view"></div>

    <script>
        var book = null;
        var rendition = null;

        function openBook(epubUrl, bookTitle) {
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('nav-title').innerText = "Loading Book...";

            // Bypasses the GitHub server security block
            var proxiedUrl = "https://corsproxy.io?" + encodeURIComponent(epubUrl);
            
            book = ePub(proxiedUrl);
            rendition = book.renderTo("reader-view", {
                width: "100%",
                height: "100%",
                flow: "scrolled-doc"
            });

            rendition.themes.default({
                "body": { "color": "#e0e0e0", "background": "#1a1a1a", "font-size": "14px", "line-height": "1.5" }
            });

            rendition.display().then(function() {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('reader-view').style.display = 'block';
                document.getElementById('nav-title').innerText = bookTitle;
            }).catch(function(err) {
                document.getElementById('loading').innerText = "Parsing Error. Please check file formatting.";
                console.error(err);
            });
        }

        document.addEventListener('keydown', function(e) {
            if (rendition && document.getElementById('reader-view').style.display === 'block') {
                if (e.keyCode === 40 || e.key === 'ArrowDown') {
                    window.scrollBy(0, 80);
                } else if (e.keyCode === 38 || e.key === 'ArrowUp') {
                    window.scrollBy(0, -80);
                }
            }
        });
    </script>

</body>
</html>
