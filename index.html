<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia Digital Bookshelf</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .header {
            background-color: #1f1f1f;
            height: 40px;
            line-height: 40px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px solid #00bc8c;
        }
        #library-view {
            padding: 10px;
        }
        .section-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .book-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }
        .book-item:focus {
            background: #00bc8c;
            border-color: #fff;
            outline: none;
        }
        #reader-view {
            display: none;
            width: 100vw;
            height: calc(100vh - 40px);
            background: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="header" id="nav-title">My Digital Bookshelf</div>
    
    <!-- LIBRARY CONTAINER INTERFACE -->
    <div id="library-view">
        <div class="section-title">Select an E-Book:</div>
        
        <!-- Clickable book list entry linking to your raw asset URL path -->
        <div class="book-item" tabindex="0" onclick="openBook('https://githubusercontent.com', 'Livewired')">
            📖 1. Livewired (David Eagleman)
        </div>
        
        <!-- Template row to easily add more items in the future -->
        <!-- <div class="book-item" tabindex="0" onclick="openBook('URL_HERE', 'BOOK_TITLE')">📖 2. Second Book Name</div> -->
    </div>

    <!-- BOOK VIEW CANVAS -->
    <div id="reader-view"></div>

    <script>
        var book = null;
        var rendition = null;

        function openBook(epubUrl, bookTitle) {
            // Swap display states to show text canvas
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('reader-view').style.display = 'block';
            document.getElementById('nav-title').innerText = bookTitle;
            
            // Spin up parsing engine configurations
            book = ePub(epubUrl);
            rendition = book.renderTo("reader-view", {
                width: "100%",
                height: "100%",
                flow: "scrolled-doc"
            });

            rendition.themes.default({
                "body": { "color": "#e0e0e0", "background": "#1a1a1a", "font-size": "14px", "line-height": "1.5" },
                "p": { "margin": "0 0 1rem 0" }
            });

            rendition.display();
        }

        // Feature phone physical keyboard mapping controls
        document.addEventListener('keydown', function(e) {
            // Handle directional scrolling within open pages
            if (rendition && document.getElementById('reader-view').style.display === 'block') {
                if (e.keyCode === 40 || e.key === 'ArrowDown') {
                    window.scrollBy(0, 60);
                } else if (e.keyCode === 38 || e.key === 'ArrowUp') {
                    window.scrollBy(0, -60);
                }
            }
        });
    </script>

</body>
</html>
