<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia Digital Bookshelf</title>
    
    <!-- LOCAL FILES -->
    <script src="jszip.min.js"></script>
    <script src="epub.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, sans-serif;
            overflow: hidden; /* Stop body scrolling */
            width: 240px;
            height: 320px;
        }
        .header {
            background-color: #1f1f1f;
            height: 40px;
            line-height: 40px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px solid #00bc8c;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            box-sizing: border-box;
            width: 240px;
        }
        .header-btn {
            color: #00bc8c;
            cursor: pointer;
            font-size: 13px;
        }
        #library-view {
            padding: 10px;
            width: 240px;
            height: 280px;
            overflow-y: auto;
        }
        .section-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .book-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }
        .book-item:focus {
            background: #00bc8c;
            border-color: #fff;
            outline: none;
        }
        
        /* HARDCODED DIMENSIONS FOR NOKIA SCREEN */
        #reader-view {
            display: none;
            width: 240px !important;
            height: 280px !important;
            background: #1a1a1a;
            position: absolute;
            top: 40px;
            left: 0;
            z-index: 5;
        }

        /* CRITICAL FIX: Force the internal epub iframe to be visible and fill the box */
        #reader-view iframe {
            width: 240px !important;
            height: 280px !important;
            border: none !important;
            display: block !important;
        }
        
        #loading {
            display: none;
            color: #00bc8c;
            font-size: 14px;
            margin-top: 100px;
            text-align: center;
            width: 240px;
        }
        #error-debug {
            color: #ff6b6b;
            font-size: 12px;
            padding: 10px;
            text-align: center;
            display: none;
            width: 220px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="header">
        <span id="back-btn" class="header-btn" style="visibility: hidden;" onclick="goBack()">✕ Back</span>
        <span id="nav-title">My Digital Bookshelf</span>
        <span class="header-btn" style="visibility: hidden;"></span>
    </div>
    
    <div id="library-view">
        <div class="section-title">Select an E-Book:</div>
        <div class="book-item" tabindex="0" onclick="openBook('book.epub', 'Livewired')">
            📖 1. Livewired (David Eagleman)
        </div>
    </div>

    <div id="loading">Loading book... please wait.</div>
    <div id="error-debug"></div>
    <div id="reader-view"></div>

    <script>
        var book = null;
        var rendition = null;

        function openBook(fileName, bookTitle) {
            // 1. Hide library
            document.getElementById('library-view').style.display = 'none';
            
            // 2. Make reader visible BEFORE rendering so it calculates size correctly
            document.getElementById('reader-view').style.display = 'block';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error-debug').style.display = 'none';
            
            document.getElementById('nav-title').innerText = "Loading...";
            document.getElementById('back-btn').style.visibility = 'visible';

            if (typeof JSZip === 'undefined' || typeof ePub === 'undefined') {
                showError("Libraries failed to load.");
                return;
            }

            try {
                book = ePub(fileName);
                
                // 3. Render with EXACT pixel dimensions for the Nokia screen
                rendition = book.renderTo("reader-view", {
                    width: 240,
                    height: 280,
                    flow: "paginated" // Paginated works better on small screens
                });

                rendition.themes.default({
                    "body": { 
                        "color": "#e0e0e0", 
                        "background": "#1a1a1a", 
                        "font-size": "14px", 
                        "line-height": "1.4",
                        "padding": "5px",
                        "margin": "0"
                    }
                });

                // 4. Display the book
                rendition.display().then(function() {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('nav-title').innerText = bookTitle;
                    
                    // Force a resize after a tiny delay to ensure the iframe wakes up
                    setTimeout(function() {
                        rendition.resize(240, 280);
                    }, 500);
                    
                }).catch(function(err) {
                    showError("Error reading book: " + err.message);
                });
            } catch (err) {
                showError("System error: " + err.message);
            }
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-debug').style.display = 'block';
            document.getElementById('error-debug').innerHTML = "⚠️ " + msg;
        }

        function goBack() {
            if (rendition) {
                rendition.destroy();
                rendition = null;
                book = null;
            }
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-debug').style.display = 'none';
            document.getElementById('library-view').style.display = 'block';
            document.getElementById('nav-title').innerText = "My Digital Bookshelf";
            document.getElementById('back-btn').style.visibility = 'hidden';
        }

        // Keypad navigation for PAGINATED mode (Next/Prev page)
        document.addEventListener('keydown', function(e) {
            if (rendition && document.getElementById('reader-view').style.display === 'block') {
                // Down arrow or Right arrow = Next Page
                if (e.keyCode === 40 || e.key === 'ArrowDown' || e.keyCode === 39 || e.key === 'ArrowRight') {
                    rendition.next();
                } 
                // Up arrow or Left arrow = Previous Page
                else if (e.keyCode === 38 || e.key === 'ArrowUp' || e.keyCode === 37 || e.key === 'ArrowLeft') {
                    rendition.prev();
                }
            }
        });
    </script>

</body>
</html>
