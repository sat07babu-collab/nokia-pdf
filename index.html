<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia Digital Bookshelf</title>
    
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, sans-serif;
            overflow: hidden;
            width: 240px; height: 320px;
        }
        
        /* LIBRARY VIEW */
        #library-view { 
            padding: 20px 10px; width: 240px; height: 320px; overflow-y: auto; box-sizing: border-box; 
        }
        .section-title { font-size: 12px; color: #00bc8c; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .book-item { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 15px; margin-bottom: 10px; cursor: pointer; font-size: 14px; font-weight: bold; color: #fff; }
        .book-item:active { background: #00bc8c; color: #000; }

        /* FULLSCREEN READER */
        #reader-container { 
            display: none; 
            position: absolute; top: 0; left: 0; 
            width: 240px; height: 320px; 
            background: #121212; z-index: 100; 
        }
        #book-content { 
            width: 240px; height: 320px; 
            padding: 15px; box-sizing: border-box;
            overflow-y: auto; 
            font-size: 14px; line-height: 1.6;
            white-space: pre-wrap; word-wrap: break-word;
            color: #e0e0e0;
        }
        
        /* Hide scrollbar for clean full-screen look */
        #book-content::-webkit-scrollbar { display: none; }
        #book-content { -ms-overflow-style: none; scrollbar-width: none; }

        /* Subtle Toast for Zoom feedback */
        #toast {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8); color: #00bc8c; padding: 10px 20px; border-radius: 20px;
            font-size: 14px; font-weight: bold; z-index: 200; pointer-events: none;
            border: 1px solid #00bc8c;
        }
    </style>
</head>
<body>

    <!-- Library Menu -->
    <div id="library-view">
        <div class="section-title">My Bookshelf</div>
        
        <!-- Book 1 -->
        <div class="book-item" onclick="openBook('book.txt', 'book1')">
            📖 Livewired
        </div>
        
        <!-- Book 2 (Make sure you upload book2.txt to GitHub!) -->
        <div class="book-item" onclick="openBook('book2.txt', 'book2')">
            📖 Book 2
        </div>
    </div>

    <!-- Fullscreen Reader -->
    <div id="reader-container">
        <div id="book-content" tabindex="0"></div>
    </div>

    <!-- Zoom Feedback -->
    <div id="toast"></div>

    <script>
        var currentFontSize = 14;
        var contentDiv = document.getElementById('book-content');
        var currentBookId = ''; // Tracks which book is currently open

        function openBook(fileName, bookId) {
            currentBookId = bookId; // Save the ID so we can save progress later
            
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('reader-container').style.display = 'block';

            fetch(fileName)
                .then(response => {
                    if (!response.ok) throw new Error("File not found");
                    return response.text();
                })
                .then(text => {
                    contentDiv.innerText = text;
                    applyFontSize();
                    
                    // RESTORE PROGRESS: Check if we have a saved scroll position for THIS specific book
                    var savedPos = localStorage.getItem(bookId + '_scroll_pos');
                    if (savedPos) {
                        contentDiv.scrollTop = parseInt(savedPos);
                    } else {
                        contentDiv.scrollTop = 0;
                    }
                })
                .catch(err => {
                    alert("Error loading " + fileName + ". Did you upload it to GitHub?");
                    goBack();
                });
        }

        function applyFontSize() {
            contentDiv.style.fontSize = currentFontSize + "px";
        }

        function adjustFont(direction) {
            if (direction === 1 && currentFontSize < 24) currentFontSize += 2;
            else if (direction === -1 && currentFontSize > 10) currentFontSize -= 2;
            applyFontSize();
            showToast("Font: " + currentFontSize + "px");
        }

        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(function() { toast.style.display = 'none'; }, 1000);
        }

        function goBack() {
            // SAVE PROGRESS for the specific book before leaving
            if (currentBookId) {
                localStorage.setItem(currentBookId + '_scroll_pos', contentDiv.scrollTop);
            }
            
            document.getElementById('reader-container').style.display = 'none';
            document.getElementById('library-view').style.display = 'block';
            currentBookId = ''; // Reset ID
        }

        // --- KEYPAD CONTROLS ---
        window.addEventListener('keydown', function(e) {
            var key = e.key;
            var code = e.keyCode;
            var isReaderOpen = document.getElementById('reader-container').style.display === 'block';

            if (isReaderOpen) {
                // 8 or Down: Scroll Down
                if (key === '8' || code === 40) {
                    contentDiv.scrollBy(0, 150);
                }
                // 2 or Up: Scroll Up
                else if (key === '2' || code === 38) {
                    contentDiv.scrollBy(0, -150);
                }
                // # : Zoom In
                else if (key === '#' || code === 35) {
                    adjustFont(1);
                }
                // * : Zoom Out
                else if (key === '*' || code === 106) {
                    adjustFont(-1);
                }
                // 9 : Go Back to Library
                else if (key === '9' || code === 57) {
                    goBack();
                }
            }
        }, true);

        // Also save progress continuously while scrolling just in case
        contentDiv.addEventListener('scroll', function() {
            if (currentBookId) {
                localStorage.setItem(currentBookId + '_scroll_pos', contentDiv.scrollTop);
            }
        });
    </script>

</body>
</html>
