<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=240, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 240px; height: 320px; overflow: hidden;
            background: #121212; color: #e0e0e0;
            font-family: -apple-system, sans-serif;
            display: flex; flex-direction: column;
        }
        #header {
            height: 24px; background: #1e1e1e; color: #00bc8c;
            text-align: center; line-height: 24px; font-weight: bold;
            font-size: 12px; border-bottom: 1px solid #333;
        }
        #chat-box {
            flex: 1; overflow-y: auto; padding: 6px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .msg {
            padding: 6px 8px; border-radius: 4px;
            word-wrap: break-word; line-height: 1.3;
            font-size: 13px; max-width: 90%;
        }
        .user { align-self: flex-end; background: #005c4b; color: white; }
        .bot { align-self: flex-start; background: #2a2a2a; color: #e0e0e0; border-left: 2px solid #00bc8c; }
        
        #input-area {
            height: 50px; border-top: 1px solid #333;
            padding: 4px; background: #1e1e1e; display: flex; flex-direction: column;
        }
        #user-input {
            width: 100%; height: 28px; background: #000; color: #00bc8c;
            border: 1px solid #555; font-family: -apple-system, sans-serif;
            font-size: 14px; padding: 2px 4px; outline: none;
        }
        #user-input:focus { border-color: #00bc8c; }
        
        #controls {
            height: 24px; display: flex; border-top: 1px solid #333; background: #1e1e1e;
        }
        .btn {
            flex: 1; text-align: center; line-height: 24px;
            color: #00bc8c; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .btn:active { background: #00bc8c; color: #000; }
        #send-btn { border-left: 1px solid #333; }
    </style>
</head>
<body>

    <div id="header">AI CHAT</div>
    
    <div id="chat-box">
        <div class="msg bot">Hello! I am ready. Type a message.</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type here..." autocomplete="off">
    </div>

    <div id="controls">
        <div class="btn" onclick="goBack()">BACK (9)</div>
        <div class="btn" id="send-btn" onclick="sendMessage()">SEND (5)</div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');
        
        window.onload = () => input.focus();

        // Keypad Navigation
        window.addEventListener('keydown', function(e) {
            var key = e.key;
            var code = e.keyCode;

            if (document.activeElement === input) {
                if (key === '5' || key === 'Enter' || code === 13) {
                    e.preventDefault();
                    sendMessage();
                }
            } else {
                if (key === '8' || code === 40) { chatBox.scrollTop += 60; }
                if (key === '2' || code === 38) { chatBox.scrollTop -= 60; }
                // NEW: Press 9 to go back to the book
                if (key === '9' || code === 57) { goBack(); }
            }
        }, true);

        function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';
            
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg bot';
            loadingDiv.id = loadingId;
            loadingDiv.innerText = 'Thinking...';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) {
                    loadingEl.innerText = getSimulatedResponse(text);
                }
                chatBox.scrollTop = chatBox.scrollHeight;
                input.focus();
            }, 800);
        }

        function getSimulatedResponse(userText) {
            const lower = userText.toLowerCase();
            if (lower.includes('hello') || lower.includes('hi')) return "Hello there! How can I help you today?";
            if (lower.includes('time')) return "The current time is " + new Date().toLocaleTimeString();
            if (lower.includes('book') || lower.includes('read')) return "Enjoying the book? Press 9 anytime to go back to reading!";
            return "You said: '" + userText + "'.\n\n(Note: This is a simulated response. The UI is fully working!)";
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = 'msg ' + sender;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function goBack() {
            // This instantly takes you back to the e-reader
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
