<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Strict viewport for Nokia 215 -->
    <meta name="viewport" content="width=240, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nokia AI Chat</title>
    <style>
        /* Reset and strict 240x320 bounding */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 240px;
            height: 320px;
            overflow: hidden;
            background: #000000;
            color: #00FF00; /* Classic Nokia Green */
            font-family: monospace;
            font-size: 14px;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        #header {
            height: 24px;
            background: #003300;
            color: #00FF00;
            text-align: center;
            line-height: 24px;
            font-weight: bold;
            border-bottom: 1px solid #00FF00;
            font-size: 12px;
        }

        /* Chat Area */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg {
            padding: 4px 6px;
            border: 1px solid #005500;
            word-wrap: break-word;
            line-height: 1.3;
            font-size: 13px;
        }
        .user { background: #002200; text-align: right; }
        .bot { background: #000000; text-align: left; border-color: #00FF00; }

        /* Input Area */
        #input-area {
            height: 60px;
            border-top: 1px solid #00FF00;
            padding: 4px;
            background: #001100;
        }
        #user-input {
            width: 100%;
            height: 32px;
            background: #000;
            color: #00FF00;
            border: 1px solid #00FF00;
            font-family: monospace;
            font-size: 14px;
            padding: 2px 4px;
            resize: none;
            outline: none;
        }
        #user-input:focus {
            background: #002200;
        }

        /* Bottom Controls */
        #controls {
            height: 24px;
            display: flex;
            border-top: 1px solid #00FF00;
            background: #003300;
        }
        .btn {
            flex: 1;
            text-align: center;
            line-height: 24px;
            color: #00FF00;
            font-size: 12px;
            font-weight: bold;
        }
        .btn:active { background: #00FF00; color: #000; }
        #send-btn { border-left: 1px solid #00FF00; }
        
        /* Hide scrollbars for cleaner look */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #005500; }
    </style>
</head>
<body>

    <div id="header">CHATGPT AI</div>
    
    <div id="chat-box">
        <div class="msg bot">Hello. Ready for input.</div>
    </div>

    <div id="input-area">
        <textarea id="user-input" rows="2" placeholder="Type here..."></textarea>
    </div>

    <div id="controls">
        <div class="btn" id="clear-btn" onclick="clearChat()">CLEAR</div>
        <div class="btn" id="send-btn" onclick="sendMessage()">SEND</div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');
        
        // IMPORTANT: Replace this with the URL of the Node.js backend server 
        // you created in the previous step (e.g., https://your-backend.vercel.app/api/chat)
        const BACKEND_URL = 'https://YOUR-BACKEND-URL-HERE.com/api/chat'; 

        // Auto-focus the input box on load for "easy direct entry"
        window.onload = () => input.focus();

        // Keypad Navigation Helper (Optional, depends on Nokia browser support)
        document.addEventListener('keydown', (e) => {
            // If user presses '5' (center key) or Enter, send message
            if ((e.key === '5' || e.key === 'Enter') && document.activeElement === input) {
                e.preventDefault();
                sendMessage();
            }
            // If user presses '8', scroll chat down
            if (e.key === '8' && document.activeElement !== input) {
                chatBox.scrollTop += 50;
            }
            // If user presses '2', scroll chat up
            if (e.key === '2' && document.activeElement !== input) {
                chatBox.scrollTop -= 50;
            }
        });

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // Add user message
            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Show loading state
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'msg bot';
            loadingMsg.innerText = 'Thinking...';
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Call your secure backend
                const res = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                
                // Replace loading message with actual reply
                loadingMsg.innerText = data.reply || 'No response.';
            } catch (err) {
                loadingMsg.innerText = 'Network Error.';
                loadingMsg.style.color = '#FF0000';
            }
            
            chatBox.scrollTop = chatBox.scrollHeight;
            input.focus(); // Return focus to input
        }

        function clearChat() {
            chatBox.innerHTML = '<div class="msg bot">Chat cleared.</div>';
        }
    </script>
</body>
</html>
